# cbindgen configuration for epub-rs C FFI
# Generates include/epub_rs.h from src/ffi.rs
# Reference: https://github.com/mozilla/cbindgen/blob/main/docs.md#cbindgentoml

language = "C"
include_guard = "EPUB_RS_H"
pragma_once = true
autogen_warning = "/* Auto-generated by cbindgen — DO NOT EDIT. Run `cargo build --features ffi` to regenerate. */"

header = """
/**
 * epub-rs C API
 *
 * Opaque-handle, JSON-centric C interface for the epub-rs EPUB processing library.
 *
 * Memory ownership rules:
 *  - All functions returning `char *` must be freed with `epub_free_string()`.
 *  - All functions returning `uint8_t *` must be freed with `epub_free_bytes(ptr, len)`.
 *  - Handles from `epub_open*` must be freed with `epub_free()`.
 *  - Passing NULL for any pointer parameter is always safe (returns NULL, sets error).
 *
 * Error handling:
 *  - On failure every function returns NULL.
 *  - Call `epub_last_error()` immediately after for a human-readable description.
 *  - The error string is valid until the next FFI call on the same thread.
 */
"""

usize_is_size_t = true

[export]
exclude = []

[export.rename]
"EpubHandle" = "epub_t"

[parse]
parse_deps = false

[fn]
sort_by = "None"

[package]
name = "epub-rs"
version = "0.1.0"
edition = "2024"
description = "An industrial-grade, highly performant EPUB 2/3 processing engine for parsing, processing, deobfuscating, and generating electronic books."
repository = "https://github.com/twn39/epub-rs"
license = "MIT"
keywords = ["epub", "ebook", "parser", "generator", "cfi"]
categories = ["parser-implementations", "text-processing"]
authors = ["twn39 <twn39@163.com>"]

[dependencies]
chrono = "0.4.44"
html5ever = "0.39.0"
kuchikiki = "0.8.2"
lol_html = "2.7.2"
percent-encoding = "2.3.2"
quick-xml = "0.39.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"
zip = "8.5.1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "epub_benchmark"
harness = false

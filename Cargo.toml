[package]
name = "epub-rs"
version = "0.2.0"
edition = "2024"
description = "An industrial-grade, highly performant EPUB 2/3 processing engine for parsing, processing, deobfuscating, and generating electronic books."
repository = "https://github.com/twn39/epub-rs"
license = "MIT"
keywords = ["epub", "ebook", "parser", "generator", "cfi"]
categories = ["parser-implementations", "text-processing"]
authors = ["twn39 <twn39@163.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4.44"
html5ever = "0.39.0"
kuchikiki = "0.8.2"
lol_html = "2.7.2"
percent-encoding = "2.3.2"
quick-xml = "0.39.2"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = "8.5.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "8.5.1", default-features = false, features = ["deflate", "time"] }
chrono = { version = "0.4.44", features = ["wasmbind"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6.5"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[profile.release]
panic = "abort"  # Prevent Rust panics from crossing the FFI boundary (UB)

[[bench]]
name = "epub_benchmark"
harness = false

[features]
default = []
ffi = []  # Enable to build the C FFI layer (no extra deps, just activates ffi.rs)
